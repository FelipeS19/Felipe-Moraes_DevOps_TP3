server:
  port: 8081
spring:
  application:
    name: product-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/product_db
jwt:
  secret: "${JWT_SECRET:marketplace-minimalista-jwt-secret-key-256bits-seguro!!}"
eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/